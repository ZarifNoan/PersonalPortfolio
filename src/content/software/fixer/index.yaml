description: >-
  Designed a Grab-style app that connects customers with nearby repair workers to book home repair
  services. The work covered the requirements document and the system design, including use case,
  sequence, class and activity diagrams. It also included an 8-table PostgreSQL database for users, repair
  workers, service listings, bookings and in-app chat. The result is a clickable JavaFX prototype with 13
  screens, including sign-up and login, browsing services, booking, wallet top-up, ratings and activity
  history.
details: |
  Fixer is a Grab-style home repair app that our team of four designed for the Business Case Project course.
  In Malaysia, finding a handyman usually depends on recommendations from family and friends or on social
  media posts, which leads to unpredictable pricing, timing and quality, and makes it hard for skilled
  workers to find steady jobs. Fixer connects customers with verified repair workers nearby.

  The business case compared four options: partnering with existing service apps, building a dedicated
  handyman app, a simple job-listing website, and a full ecosystem with AI features. It weighed each one's
  benefits, risks and estimated costs, and recommended the dedicated app as the best balance of cost, time,
  control and growth. The core features it set out are online payment, GPS tracking with Google Maps and
  Waze, service history, an advertising board for vendors, photo attachments so a worker can see the
  problem before arriving, ratings and reviews, and verification of every worker.

  The team then wrote the requirements and designed the system with use case, sequence, class and activity
  diagrams, and an 8-table PostgreSQL database for users, repair workers, service listings, bookings and
  in-app chat. The result is a clickable JavaFX prototype with 13 screens, including sign-up and login,
  browsing services, booking, wallet top-up, order tracking, ratings and activity history, along with a
  user manual that walks through setting up a profile, booking a service, tracking an order and messaging
  the worker.
