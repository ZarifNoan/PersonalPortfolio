description: >-
  Developed an AI system that spots students at risk of failing early in the semester and recommends what
  the department should do about it. It uses 27 fuzzy logic rules to predict a performance score from
  attendance, test and project marks, then a second rule-based layer turns that score into a risk level and
  a ranked list of recommended actions. Tuning the model raised accuracy from 41.7% to 72.9% and cut the
  average error from 15.4 to 9.1 points, tested on 800 students with k-fold cross-validation. A Tkinter
  desktop app shows which rules fired for each prediction, so non-technical staff can see why a student
  was flagged.
details: |
  This was a five-person team project for the Intelligent Systems course. Departments often find out that a
  student has failed only after the final exam, even though attendance, test and project marks are
  available weeks earlier. We built a decision aid that turns those three marks into a predicted performance
  score, a class (Poor, Average, Good or Excellent), a risk level and a ranked list of recommended
  interventions, and explains every step.

  The system has two layers. The first is a Mamdani fuzzy inference system in Python using scikit-fuzzy:
  each input has Low, Medium and High membership functions, 27 hand-written rules cover every combination,
  and the score is a weighted average of the output terms' peaks, so it can be checked by hand. The second
  is a forward-chaining expert system with 21 production rules that turns the result into a risk level and
  actions such as an exam-technique workshop or attendance counselling, and flags borderline cases for
  manual review. A Tkinter desktop app, shown in the screenshots below, walks staff through each prediction:
  the Predict tab gives the score, class, risk level, the rules that fired and the recommended actions, and
  further tabs show the membership functions, how the fired rules combine into one number, an evaluation of
  a whole cohort and the full rule base.
