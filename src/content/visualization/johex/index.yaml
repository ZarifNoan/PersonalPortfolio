description: >-
  Exhibition venue visualization made for RAZOVA for its collaboration with JOHEX, a halal expo showcasing
  all kinds of halal products, not just food, laid out in rows of modular booth stands around a stage.
details: |
  Exhibition venue visualization made for RAZOVA for its collaboration with JOHEX, a halal expo showcasing
  all kinds of halal products, not just food. The hall is filled with rows of modular booth stands with
  open steel-frame roofs, arranged either side of a central aisle that opens onto a stage backed by a
  spotlight truss, rows of red auditorium chairs and a block of teal armchairs. The walls carry a warm
  diamond-patterned wallpaper broken up by solid orange and yellow panels, with a dark timber fascia running
  along the ceiling edge and a small red information kiosk near the entrance. A second finished render shows
  the venue's mezzanine-level concourse: a curved balcony faced in wood slats overlooking an escalator bank,
  with a cluster of booths and a blank placeholder signage panel beneath it.

  The remaining renders are untextured grey massing studies from earlier in the process, used to work out
  the booth grid against the hall's structural columns: an overhead view of the full layout, a ground-level
  look down a booth aisle under a mezzanine soffit, a close view of the columns beside a row of booths, and
  a wider angle through a curved wall nook showing the booths and columns beyond.
