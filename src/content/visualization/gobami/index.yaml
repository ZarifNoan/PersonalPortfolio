details: |
  A product visualization of Gobami, a thermos-style container that keeps both food and drinks warm, made
  in Blender for a friend's university assignment.

  The product is shown in six patterned designs: Chinese New Year, Hari Raya, Deepavali, Earth Day, Breast
  Cancer Awareness and Autism Awareness. The first render lines up the whole collection on two shelves, and
  the close-ups show individual designs: a red and gold dragon pattern for Chinese New Year, a purple
  Deepavali pattern with floral and diya motifs, pink Breast Cancer Awareness ribbons, and colourful puzzle
  pieces on teal for Autism Awareness.
