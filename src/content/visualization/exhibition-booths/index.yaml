description: >-
  Two exhibition booth concepts modelled, lit and rendered in Blender as a personal project: a single-level
  branded "RAZOVA" booth in green, black and gold, and a two-storey booth with a ground-floor meeting area
  and an upper lounge.
details: |
  Two exhibition booth concepts, modelled, lit and rendered in Blender as a personal design exercise: a
  single-level branded booth and a two-storey booth with its own upstairs lounge.

  The first booth is built around the "RAZOVA" brand: its name stands in tall brushed-gold letters on the
  canopy above the entrance, and a matching gold "R" monogram is mounted on a glass panel at the front. Inside,
  bright green walls hold an arched niche, a circular backlit mirror and a framed painting of a bare tree,
  lit by spotlights, wall sconces and amber pendant lights. Dark fluted-wood service counters run along the
  back wall, one of them stamped "RAZOVA" in gold, with a round table and barstool in front for visitors.

  The second booth is a two-storey structure in white, pine green and gold. Downstairs holds a reception desk,
  rows of café-style dining tables and chairs, wall-mounted screens and framed pictures, a freestanding digital
  signage kiosk, and a staircase up to the mezzanine. Upstairs is a lounge of sofas and a coffee table behind a
  glass balustrade, lit by a cluster of circular gold ring pendants hanging over the ground floor below; a
  stylised green-and-gold "R" emblem sits on the upper feature wall.
