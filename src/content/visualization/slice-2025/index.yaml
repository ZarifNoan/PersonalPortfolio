title: SLICE 2025 – School Leavers Inspiration & Success Initiatives
client: true
category: Architectural Visualization
order: 2
description: >-
  Event venue visualization for SLICE 2025, powered by DASEM: an education expo where universities and
  institutions meet school leavers to share their programmes. The scene lays out the venue at Rumah
  Komuniti Parlimen Sembrong, with a main tent, exhibition booths for each institution, canopies, entrance
  and exit gates, and perimeter fencing.
images:
  - src: ./images/01-overview.png
    alt: Daytime exterior of the community hall with a white event tent, canopies and the SLICE gated entrance
  - src: ./images/02-institution-banners.png
    alt: Barrier banners for participating universities lining the walkway outside Dewan Dato Onn
  - src: ./images/03-auditorium.png
    alt: Main tent interior set up for a talk, with rows of chairs facing a SLICE title screen
  - src: ./images/04-canopy-dining.png
    alt: Outdoor canopy area with dining tables and chairs set up beside the venue
  - src: ./images/05-exit-gate.png
    alt: Close-up of the SLICE-branded exit gate with sponsor and institution logos
